name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome
      - run: npm run verify
      - run: npm run test:e2e:functional

  maplibre-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        maplibre: ["5.24.0", "6.4.1"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false maplibre-gl@${{ matrix.maplibre }}
      - run: npx playwright install --with-deps chromium chrome
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e:functional
