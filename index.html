<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0f12" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>bad-map — semantic low-resolution maps</title>
  </head>
  <body>
    <div id="app">
      <div
        id="map"
        aria-label="Interactive low-resolution map of New York City"
      ></div>
      <div id="top-bar">
        <header>
          <strong>bad-map</strong>
          <span id="status">loading vector tiles…</span>
        </header>
        <button
          id="feature-query-toggle"
          class="icon-button"
          type="button"
          aria-label="Enable mouse feature queries"
          aria-pressed="false"
          title="Enable mouse feature queries"
        >
          <i class="ph ph-cursor-click" aria-hidden="true"></i>
        </button>
        <div
          id="place-search"
          class="is-collapsed"
          role="search"
          aria-label="Place lookup"
        >
          <button
            id="place-search-toggle"
            class="icon-button"
            type="button"
            aria-label="Search places"
            aria-controls="place-search-content"
            aria-expanded="false"
            title="Search places"
          >
            <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          </button>
          <div id="place-search-content" hidden>
            <div class="place-search-field">
              <input
                id="place-search-input"
                type="search"
                placeholder="look up a place…"
                autocomplete="off"
                spellcheck="false"
                aria-label="Look up a place"
                aria-autocomplete="list"
                aria-controls="place-search-results"
                aria-expanded="false"
              />
              <button
                id="place-search-clear"
                type="button"
                aria-label="Clear place lookup"
                hidden
              >
                clear
              </button>
            </div>
            <div class="place-search-meta">
              <span id="place-search-status" role="status" aria-live="polite"
                >type at least 2 characters</span
              >
              <span
                ><a href="https://www.openstreetmap.org/copyright"
                  >OpenStreetMap</a
                >
                via
                <a href="https://photon.komoot.io/">Photon</a></span
              >
            </div>
            <ul
              id="place-search-results"
              role="listbox"
              aria-label="Place lookup results"
              hidden
            ></ul>
          </div>
        </div>
      </div>
      <div id="readout" role="status" aria-live="polite">
        Mouse feature queries are off.
      </div>
      <aside id="settings" aria-label="Map settings">
        <div
          id="settings-resize"
          class="resize-handle"
          role="separator"
          aria-label="Resize settings panel"
          aria-orientation="vertical"
          aria-valuemin="280"
          aria-valuemax="560"
          aria-valuenow="320"
          tabindex="0"
        ></div>
        <div class="panel-chrome">
          <div class="panel-toolbar">
            <div
              class="panel-tabs"
              role="tablist"
              aria-label="Settings sections"
            >
              <button
                id="tab-display"
                class="panel-tab is-active"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="panel-display"
                aria-label="Display settings"
                title="Display settings"
                data-tab="display"
              >
                <i class="ph ph-sliders-horizontal" aria-hidden="true"></i>
              </button>
              <button
                id="tab-layers"
                class="panel-tab"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="panel-layers"
                aria-label="Layer settings"
                title="Layer settings"
                data-tab="layers"
                tabindex="-1"
              >
                <i class="ph ph-stack" aria-hidden="true"></i>
              </button>
              <button
                id="tab-data"
                class="panel-tab"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="panel-data"
                aria-label="Data settings"
                title="Data settings"
                data-tab="data"
                tabindex="-1"
              >
                <i class="ph ph-chart-scatter" aria-hidden="true"></i>
              </button>
            </div>
            <div class="panel-actions">
              <button
                id="reset"
                class="icon-button"
                type="button"
                aria-label="Reset view"
                title="Reset view"
              >
                <i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i>
              </button>
              <button
                id="settings-toggle"
                class="icon-button"
                type="button"
                aria-expanded="true"
                aria-label="Collapse settings panel"
                title="Collapse settings panel"
              >
                <i class="ph ph-sidebar-simple" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="panel-scroll">
          <div
            id="panel-display"
            class="tab-panel"
            role="tabpanel"
            aria-labelledby="tab-display"
          >
            <section>
              <h2>Appearance</h2>
              <label
                >Theme
                <select id="theme">
                  <option value="dark">dark</option>
                  <option value="light">light</option>
                </select></label
              >
              <button id="color-mode" type="button">full color</button>
              <label
                >Locale
                <select id="locale">
                  <option value="en">English</option>
                  <option value="es">Español</option>
                  <option value="fr">Français</option>
                  <option value="de">Deutsch</option>
                </select></label
              >
            </section>

            <section>
              <h2>Cell lattice</h2>
              <label
                >Width <output id="cell-width-value">8</output
                ><input
                  id="cell-width"
                  type="range"
                  min="4"
                  max="16"
                  step="1"
                  value="8"
              /></label>
              <label
                >Height <output id="cell-height-value">16</output
                ><input
                  id="cell-height"
                  type="range"
                  min="8"
                  max="32"
                  step="1"
                  value="16"
              /></label>
              <label
                >Dot size <output id="dot-size-value">2</output
                ><input
                  id="dot-size"
                  type="range"
                  min="1"
                  max="4"
                  step="0.25"
                  value="2"
              /></label>
              <button id="cells" type="button">larger cell preset</button>
            </section>

            <section>
              <h2>Camera</h2>
              <label
                >Projection
                <select id="projection">
                  <option value="screen">screen lattice</option>
                  <option value="surface">3D surface</option>
                </select></label
              >
              <label
                >Bearing <output id="bearing-value">0°</output
                ><input
                  id="bearing"
                  type="range"
                  min="-180"
                  max="180"
                  step="1"
                  value="0"
              /></label>
              <label
                >Pitch <output id="pitch-value">0°</output
                ><input
                  id="pitch"
                  type="range"
                  min="0"
                  max="70"
                  step="1"
                  value="0"
                  disabled
              /></label>
            </section>

            <section>
              <h2>Source</h2>
              <label
                >Base TileJSON
                <input
                  id="base-source"
                  type="url"
                  value="https://tiles.openfreemap.org/planet"
              /></label>
              <button id="apply-sources" type="button">apply source</button>
            </section>
          </div>

          <div
            id="panel-layers"
            class="tab-panel"
            role="tabpanel"
            aria-labelledby="tab-layers"
            hidden
          >
            <section>
              <h2>Map layers</h2>
              <div id="packs" class="checks">
                <label
                  ><input id="labels" type="checkbox" checked /> labels</label
                >
                <label
                  ><input id="buildings-3d" type="checkbox" /> 3D
                  buildings</label
                >
              </div>
            </section>
          </div>

          <div
            id="panel-data"
            class="tab-panel"
            role="tabpanel"
            aria-labelledby="tab-data"
            hidden
          >
            <section>
              <h2>Uber pickup heatmap</h2>
              <label
                >Renderer
                <select id="heatmap-mode">
                  <option value="off">off</option>
                  <option value="native">native MapLibre</option>
                  <option value="lowres">low-resolution dots</option>
                </select></label
              >
              <label
                >Radius <output id="heatmap-radius-value">36</output
                ><input
                  id="heatmap-radius"
                  type="range"
                  min="12"
                  max="80"
                  step="2"
                  value="36"
              /></label>
              <label
                >Intensity <output id="heatmap-intensity-value">1.0</output
                ><input
                  id="heatmap-intensity"
                  type="range"
                  min="0.25"
                  max="3"
                  step="0.25"
                  value="1"
              /></label>
              <label
                >Opacity <output id="heatmap-opacity-value">0.76</output
                ><input
                  id="heatmap-opacity"
                  type="range"
                  min="0.1"
                  max="1"
                  step="0.01"
                  value="0.76"
              /></label>
              <output
                id="heatmap-status"
                class="section-status"
                aria-live="polite"
                >loads 100,000 NYC pickups on selection</output
              >
            </section>
          </div>
        </div>
      </aside>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
